<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANERIUM OnePass</title>
  <style>
    body { margin: 0; padding: 0; background: #0b0c15; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { text-align: center; padding: 2rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #6c5ce7; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { color: #888; font-size: 0.9rem; margin: 0 0 1.5rem; }
    .btn { display: inline-block; padding: 14px 32px; background: #6c5ce7; color: #fff; text-decoration: none; border-radius: 12px; font-size: 1.05rem; font-weight: 600; }
    .btn:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1>Returning to ANERIUM OnePass...</h1>
    <p id="status">Opening the app</p>
    <a id="retryBtn" href="#" class="btn" style="display:none">Open App</a>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      var error = params.get('error');
      var user = params.get('user');

      if (error) {
        document.getElementById('spinner').style.display = 'none';
        document.querySelector('h1').textContent = 'Sign-in failed';
        document.getElementById('status').textContent = 'Error: ' + error;
        return;
      }

      // Build the deep link - try without host first (more compatible)
      var deepLink = 'anerium://?token=' + encodeURIComponent(token || '');
      if (user) deepLink += '&user=' + user;

      var btn = document.getElementById('retryBtn');
      var status = document.getElementById('status');

      // Try multiple methods to open the app
      function tryOpenApp() {
        // Method 1: direct location change
        window.location.href = deepLink;
        
        // Method 2: try with host after 500ms if method 1 didn't work
        setTimeout(function() {
          var deepLink2 = 'anerium://redirect?token=' + encodeURIComponent(token || '');
          if (user) deepLink2 += '&user=' + user;
          
          // Create an invisible iframe to try opening the scheme
          var iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = deepLink2;
          document.body.appendChild(iframe);
          setTimeout(function() { document.body.removeChild(iframe); }, 1000);
        }, 500);
      }

      tryOpenApp();

      // Show retry button after 2.5s
      setTimeout(function() {
        document.getElementById('spinner').style.display = 'none';
        status.textContent = 'Tap below to open the app';
        btn.style.display = 'inline-block';
        btn.href = deepLink;
        btn.textContent = 'Open App';
      }, 2500);
    })();
  </script>
</body>
</html>
