<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- App icon background: cosmic indigo → violet -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a1f"/>
      <stop offset="50%" stop-color="#141233"/>
      <stop offset="100%" stop-color="#1c1240"/>
    </linearGradient>
    <!-- Monogram gradient: cyan → violet → gold -->
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <!-- Soft glow -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Background halo -->
    <radialGradient id="halo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0a1f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#halo)"/>

    <!-- Star particles -->
    <g fill="#ffffff">
      <circle cx="120" cy="120" r="1.8" opacity="0.7"/>
      <circle cx="390" cy="150" r="1.4" opacity="0.5"/>
      <circle cx="420" cy="330" r="2" opacity="0.6"/>
      <circle cx="150" cy="380" r="1.5" opacity="0.55"/>
      <circle cx="300" cy="110" r="1.2" opacity="0.4"/>
      <circle cx="90" cy="260" r="1.6" opacity="0.5"/>
      <circle cx="360" cy="410" r="1.3" opacity="0.45"/>
      <circle cx="250" cy="420" r="1.1" opacity="0.35"/>
    </g>

    <!-- Monogram "A" with subtle infinity loop -->
    <g filter="url(#glow)">
      <path d="M 256 150 L 196 372 L 224 372 L 246 300 L 266 300 L 288 372 L 316 372 Z M 254 200 L 261 274 L 247 274 Z"
            fill="none" stroke="url(#mono)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Crossbar -->
      <path d="M 220 326 L 292 326" stroke="url(#mono)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
      <!-- Infinity loop sweep through the A -->
      <path d="M 256 150 C 340 150 340 372 256 372 C 172 372 172 150 256 150 Z"
            fill="none" stroke="url(#mono)" stroke-width="2.5" stroke-linecap="round" opacity="0.28"/>
    </g>

    <!-- "ONE PASS" micro label -->
    <text x="256" y="430" text-anchor="middle" font-family="'Sora', 'Segoe UI', sans-serif"
          font-size="26" font-weight="700" letter-spacing="6" fill="url(#mono)" opacity="0.92">ONE PASS</text>
  </g>

  <!-- Subtle top sheen -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
</svg>
