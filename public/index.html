// Also add "Download App" to the footer periodically
(function() {
  function addFooterLink() {
    if (document.getElementById('footer-app-link')) return;
    var footer = document.querySelector('footer');
    if (!footer) return;
    // Find "Company" heading in footer
    var els = footer.querySelectorAll('*');
    for (var i = 0; i < els.length; i++) {
      if (els[i].textContent.trim() === 'Company' && els[i].children.length === 0) {
        var section = els[i].closest('div') || els[i].parentElement;
        if (section && !section.querySelector('#footer-app-link')) {
          var link = document.createElement('a');
          link.id = 'footer-app-link';
          link.href = '/download';
          link.textContent = 'Download App';
          link.style.cssText = 'display:block;padding:4px 0;color:inherit;text-decoration:none;font-size:14px;opacity:0.8;';
          section.appendChild(link);
        }
        return;
      }
    }
  }
  setInterval(addFooterLink, 2000);
  var obs = new MutationObserver(addFooterLink);
  obs.observe(document.body, { childList: true, subtree: true });
})();
</script>
