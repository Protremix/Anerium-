services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: anerium
      POSTGRES_USER: anerium
      POSTGRES_PASSWORD: ${DB_PASSWORD:-4142805924c0dce85fff8d0041dfd8ad2dff7f8d656691bc}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - max_wal_size=1GB
      - -c
      - archive_timeout=300
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=2560MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=50
      - -c
      - default_statistics_target=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /opt/anerium/wal_archive:/wal_archive
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anerium"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: anerium
      DB_USER: anerium
      DB_PASSWORD: ${DB_PASSWORD:-4142805924c0dce85fff8d0041dfd8ad2dff7f8d656691bc}
      JWT_SECRET: ${JWT_SECRET:-646165297bdf6de75e6d3454132e730f57c056605e1a577b52ba21764b3d7804}
      PORT: 3001
      NODE_ENV: production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OPENAI_PROJECT_KEY: ${OPENAI_PROJECT_KEY}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./public:/app/public

volumes:
  postgres_data:
